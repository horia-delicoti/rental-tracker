version: 2
updates:
  # Action majors are where Node-runtime deprecations show up. Without this,
  # the first warning you get is a notice in a workflow log.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  # Dev tooling only — the app ships zero runtime dependencies.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
